<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="google" content="notranslate" />
  <meta property="og:locale" content="ko_KR" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="계좌번호 복사" />
  <meta property="og:description" content="신한은행 110-489-065282" />

  <title>계좌번호 복사</title>

  <style>
    :root{
      --bg:#ffffff;
      --card:#ffffff;
      --border:#e5e7eb;
      --text:#0f172a;
      --muted:#6b7280;
      --shadow:0 12px 40px rgba(0,0,0,.08);
      --radius:26px;
      --btn-radius:20px;
    }

    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,"Noto Sans KR","Apple SD Gothic Neo",sans-serif;
      background:var(--bg);
      color:var(--text);
    }

    .wrap{
      min-height:100svh;
      display:grid;
      place-items:center;
      padding:24px;
    }

    .card{
      width:min(520px,100%);
      background:var(--card);
      border-radius:var(--radius);
      padding:22px 20px 24px;
      box-shadow:var(--shadow);
      border:1px solid var(--border);
      text-align:center;
    }

    /* 브랜드 로고 */
    .brand{
      display:flex;
      justify-content:center;
      margin-bottom:14px;
    }

    .brand-logo{
      max-width:150px;
      width:100%;
      height:auto;
    }

    /* 계좌 박스 */
    .box{
      border:1px solid var(--border);
      border-radius:20px;
      padding:18px 14px;
      background:#f9fafb;
      margin-bottom:18px;
    }

    .bank{
      margin:0 0 6px 0;
      font-size:15px;
      font-weight:700;
      color:var(--muted);
    }

    .acct{
      margin:0;
      font-size:28px;
      font-weight:900;
      letter-spacing:-0.02em;
    }

    /* 복사 버튼 */
    .btn{
      width:100%;
      height:58px;
      border:none;
      border-radius:var(--btn-radius);
      background:linear-gradient(180deg,#111827 0%,#020617 100%);
      color:#ffffff;
      font-size:16px;
      font-weight:900;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      cursor:pointer;
      -webkit-tap-highlight-color:transparent;
    }

    .btn:active{
      transform:translateY(1px);
    }

    .hint{
      margin-top:10px;
      font-size:12px;
      color:#9ca3af;
    }

    /* 토스트 */
    .toast{
      position:fixed;
      left:50%;
      bottom:18px;
      transform:translateX(-50%);
      background:#111827;
      color:#fff;
      padding:10px 16px;
      border-radius:999px;
      font-size:13px;
      opacity:0;
      pointer-events:none;
      transition:opacity .2s ease;
    }

    .toast.show{
      opacity:1;
    }
  </style>
</head>

<body>
  <main class="wrap">
    <section class="card">
      <!-- 로고 -->
      <div class="brand">
        <img
          src="https://barhwa012.github.io/pay/barhwalogo.jpg"
          alt="BarHwa"
          class="brand-logo"
        />
      </div>

      <!-- 계좌 정보 -->
      <div class="box">
        <p class="bank">신한은행</p>
        <p class="acct" id="acct">110-489-065282</p>
      </div>

      <!-- 복사 버튼 -->
      <button class="btn" id="copyBtn" type="button">
        📋 계좌번호 복사
      </button>
      <p class="hint">버튼을 누르면 클립보드에 복사됩니다.</p>
    </section>
  </main>

  <div class="toast" id="toast">복사되었습니다</div>

  <script>
    (function(){
      const text = "신한은행 110-489-065282";
      const btn = document.getElementById("copyBtn");
      const toast = document.getElementById("toast");

      function showToast(){
        toast.classList.add("show");
        setTimeout(()=>toast.classList.remove("show"),1400);
      }

      async function copy(){
        try{
          if(navigator.clipboard && window.isSecureContext){
            await navigator.clipboard.writeText(text);
          }else{
            const ta=document.createElement("textarea");
            ta.value=text;
            ta.style.position="fixed";
            ta.style.top="-9999px";
            document.body.appendChild(ta);
            ta.select();
            document.execCommand("copy");
            document.body.removeChild(ta);
          }
          showToast();
        }catch(e){
          alert("복사에 실패했습니다. 길게 눌러 복사해주세요.");
        }
      }

      btn.addEventListener("click", copy);
    })();
  </script>
</body>
</html>
